name: Build

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v0.1.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04  # oldest supported glibc -> AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: scripts/ci-version.sh >> "$GITHUB_ENV"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package AppImage
        run: scripts/package-linux.sh build dist "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: VidOps-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: scripts/ci-version.sh >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/VidOps"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/Release/VidOps.exe $dist
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$dist/VidOps.exe"
          ./scripts/fetch-tools.ps1 -Dest "$dist/tools"
          Copy-Item LICENSE, README.md $dist
          Compress-Archive -Path $dist -DestinationPath "dist/VidOps-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VidOps-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS (dmg, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: scripts/ci-version.sh >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: scripts/package-macos.sh build dist "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: VidOps-macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Tag pushes use the pushed tag; manual runs create the tag on the built commit.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
